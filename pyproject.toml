[project]
name = "menged-backend"
version = "1.0.0"
description = "Menged: a Telegram bot (and later app) that tells public-transport riders in Addis Ababa where they are and when to get off."
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
